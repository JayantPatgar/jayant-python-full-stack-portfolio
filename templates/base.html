<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jayant Krishna Patgar - Python Full Stack Developer Portfolio">
    <title>{% block title %}Jayant Krishna Patgar | Python Full Stack Developer{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="site-header">
    <div class="container nav-wrap">
        <a href="{{ url_for('home') }}" class="brand"><span>J</span>ayant<span>.</span></a>
        <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
        <nav class="nav-links">
            <a class="{% if request.endpoint == 'home' %}active{% endif %}" href="{{ url_for('home') }}">Home</a>
            <a class="{% if request.endpoint == 'about' %}active{% endif %}" href="{{ url_for('about') }}">About</a>
            <a class="{% if request.endpoint == 'skills' %}active{% endif %}" href="{{ url_for('skills') }}">Skills</a>
            <a class="{% if request.endpoint == 'projects' %}active{% endif %}" href="{{ url_for('projects') }}">Projects</a>
            <a class="{% if request.endpoint == 'contact' %}active{% endif %}" href="{{ url_for('contact') }}">Contact</a>
        </nav>
    </div>
</header>
<main>{% block content %}{% endblock %}</main>
<footer class="site-footer">
    <div class="container footer-wrap">
        <div><a href="{{ url_for('home') }}" class="footer-brand">JK.</a><p>Python Full Stack Developer</p></div>
        <p>© {{ current_year }} Jayant Krishna Patgar. All Rights Reserved.</p>
    </div>
</footer>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
